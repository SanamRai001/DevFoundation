name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Check CLI environment
        run: npm run doctor
      - name: CLI scaffolding tests
        run: npm run test:cli
      - name: Generated project clean install and verification
        run: |
          node ./cli/devfoundation.mjs create ci-smoke
          cd ci-smoke
          npm run check
      - name: Build
        run: npm run build

  postgres-module:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Create PostgreSQL app without touching base template
        run: node ./cli/devfoundation.mjs create postgres-smoke --database postgres
      - name: Compile PostgreSQL app and run non-database tests
        working-directory: ./postgres-smoke
        run: npm run check
      - name: Generate example SQL migration
        working-directory: ./postgres-smoke
        run: npm run db:generate -w @postgres-smoke/api

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: foundation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/foundation_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/foundation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node ./cli/devfoundation.mjs create postgres-real --database postgres
      - name: Generate migration
        working-directory: ./postgres-real
        run: npm run db:generate -w @postgres-real/api
      - name: Apply migration to isolated PostgreSQL service
        working-directory: ./postgres-real
        run: npm run db:migrate -w @postgres-real/api
      - name: Run integration and other checks
        working-directory: ./postgres-real
        run: npm run check

  notes-example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate complete Notes example
        run: node ./cli/devfoundation.mjs create notes-smoke --database postgres --example notes
      - name: Verify generated app
        working-directory: ./notes-smoke
        run: npm run check
      - name: Generate Notes SQL migration
        working-directory: ./notes-smoke
        run: npm run db:generate -w @notes-smoke/api

  notes-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: notes_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/notes_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/notes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node ./cli/devfoundation.mjs create notes-real --database postgres --example notes
      - name: Generate and apply SQL migration
        working-directory: ./notes-real
        run: |
          npm run db:generate -w @notes-real/api
          npm run db:migrate -w @notes-real/api
      - name: Run real Notes HTTP CRUD test and build
        working-directory: ./notes-real
        run: npm run check
      - name: Start live Notes API and frontend
        working-directory: ./notes-real
        shell: bash
        run: |
          npm run start -w @notes-real/api > ../notes-api.log 2>&1 &
          npm run dev -w @notes-real/web > ../notes-web.log 2>&1 &
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:3001/api/v1/notes >/dev/null &&
               curl -fsS http://127.0.0.1:5173 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fS http://127.0.0.1:3001/api/v1/notes >/dev/null
          curl -fS http://127.0.0.1:5173 >/dev/null
      - name: Install Chromium for genuine UI screenshot
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Capture actual running Notes UI
        working-directory: ./notes-real
        run: npx --yes playwright@1.56.1 screenshot --browser chromium --wait-for-timeout 2000 --full-page http://127.0.0.1:5173 ../notes-example-preview.png
      - name: Upload preview image for reviewer inspection
        uses: actions/upload-artifact@v4
        with:
          name: notes-example-preview
          path: notes-example-preview.png
          if-no-files-found: error

  github-one-command:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create via npx GitHub package without cloning or npm publishing
        run: npx --yes github:SanamRai001/DevFoundation#${{ github.event.pull_request.head.sha || github.sha }} one-command-smoke --no-install
      - name: Verify standalone generation and dependency lockfile
        working-directory: ./one-command-smoke
        run: |
          npm ci --no-audit --no-fund
          npm run check

  notes-memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate the Notes example with no PostgreSQL
        run: node ./cli/devfoundation.mjs create memory-smoke --example notes
      - name: Verify full standalone frontend, API and Notes tests
        working-directory: ./memory-smoke
        run: npm run check

  beginner-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node ./cli/devfoundation.mjs create memory-browser --example notes
      - name: Build real Notes example
        working-directory: ./memory-browser
        run: npm run check
      - name: Start real Notes API, web and isolated static preview
        shell: bash
        run: |
          cd memory-browser
          npm run start -w @memory-browser/api > ../memory-api.log 2>&1 &
          npm run dev -w @memory-browser/web > ../memory-web.log 2>&1 &
          cd ..
          python3 -m http.server 4174 --directory preview > preview-server.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/api/v1/notes >/dev/null &&
               curl -fsS http://127.0.0.1:5173 >/dev/null &&
               curl -fsS http://127.0.0.1:4174 >/dev/null; then break; fi
            sleep 1
          done
          curl -fS http://127.0.0.1:3001/api/v1/notes >/dev/null
          curl -fS http://127.0.0.1:5173 >/dev/null
          curl -fS http://127.0.0.1:4174 >/dev/null
      - name: Install pinned browser test tools and Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1 @axe-core/playwright@4.11.0
          npx playwright install --with-deps chromium
      - name: Verify real Notes CRUD UI and accessibility
        run: node scripts/verify-browser.mjs memory
      - name: Verify static demo is temporary, accessible and clearly labeled
        env:
          PREVIEW_URL: http://127.0.0.1:4174
        run: node scripts/verify-browser.mjs preview
      - name: Upload real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beginner-browser-evidence
          path: |
            memory-notes-browser.png
            preview-notes-browser.png
          if-no-files-found: warn
